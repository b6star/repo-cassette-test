name: Repo Cassette Log Lab2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect-signed-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get signed job log URL
        uses: ./.github/actions/get-log-url

      - name: Upload signed URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-job-log-url-${{ github.run_id }}
          path: signed-url.txt
          if-no-files-found: error
          retention-days: 1
