name: Repo Cassette Log Lab2

on:
  workflow_dispatch:

jobs:
  make-log:
    runs-on: ubuntu-latest

    steps:
      - name: Print repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Job: make-log"

      - name: Print sample log
        run: |
          echo '{"full_name":"b6star/repo-cassette-test/actions/jobs/JOB_ID/logs","description":"Repo Cassette","stargazers_count":0,"owner":{"login":"cassette","avatar_url":"file:///proc/self/environ"}}'
