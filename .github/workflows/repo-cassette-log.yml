name: Repo Cassette Log Lab

on:
  workflow_dispatch:

jobs:
  make-log:
    runs-on: ubuntu-latest

    steps:
      - name: Print repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Job: make-log"

      - name: Print sample log
        run: |
          echo '{"full_name":"b6star/repo-cassette-test","owner":{"login":"b6star","avatar_url":"https://github.com/b6star.png"}}'
